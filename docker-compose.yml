services:
  r2music-archive:
    build:
      context: .
      args:
        VITE_API_URL: ""
    ports:
      - "127.0.0.1:3004:3000"
    volumes:
      - ./rnr_image:/app/rnr_image:ro
      - ./xyx:/app/xyx:ro
      - ./pmang_image:/app/pmang_image:ro
      - ./record_screenshots:/app/record_screenshots
    env_file:
      - .env
      - backend/.env
    environment:
      # Override the legacy host-published database endpoint from .env.
      DB_HOST: postgres-1
      DB_PORT: "5432"
      PYTHONDONTWRITEBYTECODE: "1"
      XDG_CONFIG_HOME: /config
      XDG_DATA_HOME: /data
    networks:
      - default
      - r2-postgres
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /config:size=16m,mode=0700,uid=1026,gid=100
      - /data:size=32m,mode=0700,uid=1026,gid=100
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 2g
    cpu_shares: 768
    restart: unless-stopped

networks:
  r2-postgres:
    external: true
    name: r2-postgres-network
