name: Verify deployed character homes
on:
  workflow_dispatch:
    inputs:
      short_code:
        description: Temporary QA snapshot code
        required: false
        type: string
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check deployed pages and native motion assets
        working-directory: frontend
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/results.json
          LIVE_SHORT_CODE: ${{ inputs.short_code }}
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test --config=playwright.live.config.js --reporter=line,json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: live-browser-results
          path: frontend/test-results/
          retention-days: 7
