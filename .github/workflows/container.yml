name: Build R2Archive image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: r2archive-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
          npm test
          npm run build

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/poetry.lock
      - name: Test backend
        run: |
          python -m pip install --upgrade pip poetry
          cd backend
          poetry config virtualenvs.create false
          poetry install --only main --no-interaction
          python -m pip install "numpy==2.5.3"
          python -m unittest discover -s tests -v

  ui:
    if: ${{ !contains(github.event.head_commit.message, '[skip-ui]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        width: [1920, 1440, 1024, 768]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test UI layout stability
        working-directory: frontend
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/results.json
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e -- --project=chromium-${{ matrix.width }} --reporter=line,json --max-failures=8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-results-${{ matrix.width }}
          path: frontend/test-results/
          retention-days: 7

  build-scan:
    needs: [test, ui]
    if: ${{ always() && needs.test.result == 'success' && (needs.ui.result == 'success' || needs.ui.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: ghcr.io/njkim-dev/r2archive:${{ github.sha }}
          build-args: SECURITY_REFRESH=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test public SEO responses
        run: |
          docker run -d --rm --name r2archive-seo -p 127.0.0.1:8300:3000 --entrypoint caddy ghcr.io/njkim-dev/r2archive:${{ github.sha }} run --config /etc/caddy/Caddyfile
          trap 'docker rm -f r2archive-seo' EXIT
          python frontend/scripts/check-seo-http.py http://127.0.0.1:8300

      - name: Test trusted proxy chain
        run: docker run --rm --volume "$PWD/backend/tests/test_proxy_chain.py:/tmp/test_proxy_chain.py:ro" --env PYTHONPATH=/app/backend --entrypoint python ghcr.io/njkim-dev/r2archive:${{ github.sha }} /tmp/test_proxy_chain.py -v

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/njkim-dev/r2archive:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  push:
    needs: build-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push immutable image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ghcr.io/njkim-dev/r2archive:${{ github.sha }}
          build-args: SECURITY_REFRESH=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
