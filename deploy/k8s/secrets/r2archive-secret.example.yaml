apiVersion: v1
kind: Secret
metadata:
  name: r2archive-secret
  namespace: r2
type: Opaque
stringData:
  DB_USER: r2archive
  DB_PASSWORD: replace-with-the-app-password-above
  SESSION_SECRET: replace-with-random-session-secret
  OAUTH_GOOGLE_CLIENT_ID: replace-me
  OAUTH_GOOGLE_CLIENT_SECRET: replace-me
  OAUTH_KAKAO_CLIENT_ID: replace-me
  OAUTH_NAVER_CLIENT_ID: replace-me
  OAUTH_NAVER_CLIENT_SECRET: replace-me
