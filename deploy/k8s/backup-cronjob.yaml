apiVersion: batch/v1
kind: CronJob
metadata:
  name: r2music-backup
  namespace: r2
spec:
  schedule: "30 3 * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: r2music-backup
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 999
            runAsGroup: 100
            fsGroup: 100
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pg-dump
              image: postgis/postgis:17-3.5
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  umask 077
                  dir=/backup/postgres
                  mkdir -p "$dir"
                  stamp=$(date +%Y%m%d-%H%M%S)
                  target="$dir/r2music-$stamp.dump"
                  pg_dump -h r2-postgis -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc -Z 9 -f "$target"
                  pg_restore --list "$target" >/dev/null
                  sha256sum "$target" > "$target.sha256"
                  find "$dir" -type f -mtime +30 -delete
                  echo "backup=$target"
              envFrom:
                - secretRef:
                    name: r2-postgis-secret
              volumeMounts:
                - name: data
                  mountPath: /backup
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: r2-data
