server {
    listen 80;
    server_name r2music.njkim.tech;

    location ^~ /.well-known/acme-challenge {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://music.r2archive.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name r2music.njkim.tech;

    ssl_certificate /usr/syno/etc/certificate/_archive/Xdd45O/fullchain.pem;
    ssl_certificate_key /usr/syno/etc/certificate/_archive/Xdd45O/privkey.pem;

    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 20s;
    reset_timedout_connection on;

    limit_req zone=r2archive_per_ip burst=20 nodelay;
    limit_conn r2archive_conn_per_ip 20;
    limit_req_status 429;
    limit_conn_status 429;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        return 301 https://music.r2archive.com$request_uri;
    }
}
