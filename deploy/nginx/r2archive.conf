server {
    listen 443 ssl;
    server_name r2archive.com;

    ssl_certificate /usr/syno/etc/certificate/_archive/fHWUEe/fullchain.pem;
    ssl_certificate_key /usr/syno/etc/certificate/_archive/fHWUEe/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 301 https://music.r2archive.com$request_uri;
}

server {
    listen 80;
    server_name music.r2archive.com xyx.r2archive.com r2archive.com;

    location ^~ /.well-known/acme-challenge {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
