server {
    listen 443 ssl;
    server_name music.r2archive.com;

    ssl_certificate /usr/syno/etc/certificate/_archive/ISt6Ga/fullchain.pem;
    ssl_certificate_key /usr/syno/etc/certificate/_archive/ISt6Ga/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 10m;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 20s;
    reset_timedout_connection on;

    location / {
        limit_req zone=r2archive_per_ip burst=60 nodelay;
        limit_conn r2archive_conn_per_ip 40;
        limit_req_status 429;
        limit_conn_status 429;

        proxy_pass http://192.168.0.8:30004;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
        proxy_request_buffering on;
        proxy_buffering on;
    }
}

